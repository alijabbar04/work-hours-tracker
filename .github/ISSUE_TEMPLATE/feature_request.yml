name: Feature request
description: Suggest a useful change.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the use case without personal or client information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
    validations:
      required: true

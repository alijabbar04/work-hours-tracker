name: Bug report
description: Report a problem using a synthetic example.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Keep private information out of this report. Do not upload real workbooks, invoices, work notes, API keys, personal details or private file paths.'
  - type: input
    id: version
    attributes:
      label: App version and operating system
      placeholder: '1.0.0, Windows 11 x64, downloaded ZIP'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Use invented entries and details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Redact private data from any screenshot or error text.
    validations:
      required: true
